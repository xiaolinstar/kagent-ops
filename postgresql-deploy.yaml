apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pvc
  namespace: kagent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-postgresql
  namespace: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kagent-postgresql
  template:
    metadata:
      labels:
        app: kagent-postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          value: kagent
        - name: POSTGRES_PASSWORD
          value: kagent
        - name: POSTGRES_DB
          value: kagent
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgresql-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgresql-storage
        persistentVolumeClaim:
          claimName: postgresql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kagent-postgresql
  namespace: kagent
spec:
  selector:
    app: kagent-postgresql
  ports:
  - port: 5432
    targetPort: 5432
