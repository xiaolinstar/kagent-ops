apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: zookeeper-base

resources:
  - namespace.yaml
  - configmap.yaml
  - statefulset.yaml
  - service.yaml
  - grafana-dashboard.yaml

labels:
  - pairs:
      app: zookeeper
      app.kubernetes.io/name: zookeeper
      app.kubernetes.io/part-of: sre-demo
    includeSelectors: true