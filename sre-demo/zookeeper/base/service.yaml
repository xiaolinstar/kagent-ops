# Headless Service - 用于 Pod 间通信和 DNS 解析
apiVersion: v1
kind: Service
metadata:
  name: zk-headless
  namespace: sre-demo
  labels:
    app: zookeeper
spec:
  clusterIP: None
  ports:
    - port: 2181
      name: client
      targetPort: 2181
    - port: 2888
      name: follower
      targetPort: 2888
    - port: 3888
      name: election
      targetPort: 3888
  selector:
    app: zookeeper
---
# Client Service - 客户端访问入口
apiVersion: v1
kind: Service
metadata:
  name: zk-client
  namespace: sre-demo
  labels:
    app: zookeeper
spec:
  type: ClusterIP
  ports:
    - port: 2181
      name: client
      targetPort: 2181
  selector:
    app: zookeeper
---
# Metrics Service - 用于 Prometheus 抓取
apiVersion: v1
kind: Service
metadata:
  name: zk-metrics
  namespace: sre-demo
  labels:
    app: zookeeper
    metrics: prometheus
spec:
  clusterIP: None
  ports:
    - port: 7070
      name: metrics
      targetPort: 7070
  selector:
    app: zookeeper