apiVersion: v1
kind: ConfigMap
metadata:
  name: zk-config
  namespace: sre-demo
  labels:
    app: zookeeper
data:
  # ZooKeeper 配置
  zoo.cfg: |
    # 基础配置
    tickTime=2000
    initLimit=10
    syncLimit=5
    dataDir=/data
    dataLogDir=/datalog
    clientPort=2181
    maxClientCnxns=60
    minSessionTimeout=4000
    maxSessionTimeout=40000

    # 集群配置（5 节点）
    server.1=zk-0.zk-headless.sre-demo:2888:3888
    server.2=zk-1.zk-headless.sre-demo:2888:3888
    server.3=zk-2.zk-headless.sre-demo:2888:3888
    server.4=zk-3.zk-headless.sre-demo:2888:3888
    server.5=zk-4.zk-headless.sre-demo:2888:3888

    # 4LW 命令（用于健康检查和指标采集）
    4lw.commands.whitelist=mntr,conf,srvr,stat,ruok

    # 监听所有 IP（避免 DNS 解析问题）
    quorumListenOnAllIPs=true

  # 启动脚本
  setup.sh: |
    #!/bin/bash
    # 从 Pod 名称提取 server ID
    HOSTNAME=$(hostname)
    SERVER_ID=$(echo $HOSTNAME | grep -o '[0-9]*')
    SERVER_ID=$((SERVER_ID + 1))

    # 写入 myid 文件
    echo $SERVER_ID > /data/myid

    echo "ZooKeeper server ID: $SERVER_ID"
    echo "Starting ZooKeeper..."

    # 启动 ZK
    exec zkServer.sh start-foreground