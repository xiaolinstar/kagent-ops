apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-zookeeper
  namespace: sre-demo
  labels:
    grafana_dashboard: "true"  # Grafana Sidecar 自动发现
    grafana_folder: "sre-demo"
data:
  zookeeper-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 5}
                ]
              }
            }
          },
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "title": "ZK Nodes Online",
          "type": "stat",
          "targets": [
            {
              "expr": "count(up{job=\"zookeeper\", namespace=\"sre-demo\"} == 1)",
              "legendFormat": "Online",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {"mode": "none"}
              },
              "unit": "short"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 6, "y": 0},
          "id": 2,
          "title": "Active Connections",
          "type": "timeseries",
          "targets": [
            {
              "expr": "zk_num_alive_connections{namespace=\"sre-demo\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {"mode": "none"}
              },
              "unit": "ms"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 18, "y": 0},
          "id": 3,
          "title": "Average Latency",
          "type": "timeseries",
          "targets": [
            {
              "expr": "zk_avg_latency{namespace=\"sre-demo\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {"mode": "none"}
              },
              "unit": "short"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 4,
          "title": "Outstanding Requests",
          "type": "timeseries",
          "targets": [
            {
              "expr": "zk_outstanding_requests{namespace=\"sre-demo\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {"mode": "none"}
              },
              "unit": "short"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 5,
          "title": "ZNode Count",
          "type": "timeseries",
          "targets": [
            {
              "expr": "zk_znode_count{namespace=\"sre-demo\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {"mode": "none"}
              },
              "unit": "short"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 6,
          "title": "Followers Count (on Leader)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "zk_followers{namespace=\"sre-demo\"}",
              "legendFormat": "{{pod}} (followers)",
              "refId": "A"
            },
            {
              "expr": "zk_synced_followers{namespace=\"sre-demo\"}",
              "legendFormat": "{{pod}} (synced)",
              "refId": "B"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": {"mode": "none"}
              },
              "unit": "ops"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 7,
          "title": "Requests per Second",
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(zk_packets_received{namespace=\"sre-demo\"}[5m])",
              "legendFormat": "{{pod}} received",
              "refId": "A"
            },
            {
              "expr": "rate(zk_packets_sent{namespace=\"sre-demo\"}[5m])",
              "legendFormat": "{{pod}} sent",
              "refId": "B"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["zookeeper", "sre-demo"],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "name": "DS_PROMETHEUS",
            "query": "prometheus",
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "ZooKeeper Cluster Overview",
      "uid": "zk-cluster-overview",
      "version": 1
    }