apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: zookeeper-dev

namespace: sre-demo

resources:
  - ../../base

# 开发环境配置
patches:
  # 修改 StatefulSet 副本数（可选）
  - target:
      kind: StatefulSet
      name: zk
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3

# 镜像配置
images:
  - name: zookeeper
    newTag: 3.8.4