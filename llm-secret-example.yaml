# LLM Provider API Key Secret 示例
# 
# 使用说明：
# 1. 复制此文件为 llm-secret.yaml（去掉 -example）
# 2. 根据实际使用的 Provider 修改：
#    - name: kagent-{provider}（如 kagent-deepseek、kagent-openai）
#    - 对应的 API Key 字段名
# 3. 填入你的实际 API Key
# 4. 执行: kubectl apply -f llm-secret.yaml --context kind-kagent
#
# 常见 Provider 配置：
# - DeepSeek: DEEPSEEK_API_KEY，访问 https://platform.deepseek.com/
# - OpenAI: OPENAI_API_KEY，访问 https://platform.openai.com/
# - 其他 OpenAI 兼容接口：参考对应平台文档
#
# 注意：
# - llm-secret.yaml 包含敏感信息，不要提交到 Git 仓库
# - 此示例文件可以安全提交

apiVersion: v1
kind: Secret
metadata:
  name: kagent-deepseek
  namespace: kagent
type: Opaque
stringData:
  DEEPSEEK_API_KEY: "YOUR_DEEPSEEK_API_KEY"  # ← 替换为你的实际 API Key
