apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: sre-readonly
  namespace: kagent
spec:
  kagent: {}
  env:
    # atelet / 运行时经镜像站拉 OCI 层时，HTTP/2 易 PROTOCOL_ERROR（与本地验收一致）
    - name: GODEBUG
      value: http2client=0
  substrate:
    snapshotPolicy:
      location: gs://ate-snapshots/kagent/
    workerPoolRef:
      name: kagent-default
  workload:
    # 国内 ECS：用南大 GHCR 镜像站 + 官方多架构 index digest（amd64/arm64 通用）。
    # 禁止套用本地 kind 的 ARM64 平台摘要 03c64b9e...。
    # atelet 按此 ref 自建 Image cache，containerd 的 ctr pull 不会自动满足它。
    image: ghcr.nju.edu.cn/kagent-dev/kagent/golang-adk:1.0.0-alpha13@sha256:ae01c3a6d7e0ed2e044253a26abbfb1a9426f3176363842ca9a954762c274d36
