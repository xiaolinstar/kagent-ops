# 示例；实际部署入口为 scripts/local-up.sh。
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: simple-harness
  namespace: kagent
spec:
  kagent: {}
  env:
  - name: GODEBUG
    value: http2client=0
  substrate:
    snapshotPolicy:
      location: gs://ate-snapshots/kagent/
    workerPoolRef:
      name: kagent-default
  workload:
    image: ghcr.nju.edu.cn/kagent-dev/kagent/golang-adk:1.0.0-alpha13@sha256:03c64b9ef059c472e1e151721ccc97aafd71d7b99edde05a647e64045510ddf2
