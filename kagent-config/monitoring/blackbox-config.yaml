# Blackbox Exporter 模块配置
# 该 ConfigMap 会被 kube-prometheus-stack 挂载到 blackbox-exporter Pod 中
# 模块名称对应 Probe.spec.module 字段
#
# 部署后用：kubectl -n monitoring get cm blackbox-exporter-configuration -o yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-configuration
  namespace: monitoring
  labels:
    app: blackbox-exporter
data:
  blackbox.yml: |
    modules:
      # 用于 kagent/业务 API 服务：探测 /healthz，接受 2xx
      http_2xx_healthz:
        prober: http
        timeout: 5s
        http:
          preferred_ip_protocol: ip4
          valid_status_codes: [200, 204]
          method: GET
          follow_redirects: true
          fail_if_body_matches_regexp: []
        # 失败重试一次（避免抖动误报）
      # 用于 Admin 前端：探测 /，接受 2xx/3xx
      http_2xx_root:
        prober: http
        timeout: 5s
        http:
          preferred_ip_protocol: ip4
          valid_status_codes: [200, 201, 301, 302, 303, 307, 308]
          method: GET
          follow_redirects: true