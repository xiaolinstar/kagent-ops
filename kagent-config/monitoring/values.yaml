# kube-prometheus-stack Helm Values
# 监控 kagent 集群 + 业务服务（drinkzen / party-helper）

# ============================================================
# Blackbox Exporter - 独立 Helm release（本 chart 51.x 已移除内置子 chart）
# 安装方式见 blackbox-values.yaml 顶部注释；Probe CRD 见 probes/
# ============================================================

# ============================================================
# Prometheus 配置
# ============================================================
prometheus:
  prometheusSpec:
    # 监控所有命名空间
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    
    # 存储配置 - PVC 持久化（重启不丢数据）
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
          # storageClassName: <name>  # 如需指定 StorageClass，取消注释并填入名称
    
    # 资源限制
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    
    # 保留时间
    retention: 15d
    
    # 额外抓取配置 - 监控 kagent
    additionalScrapeConfigs:
      - job_name: 'kagent-controller'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kagent
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: kagent-controller
            action: keep
          - source_labels:
              - __meta_kubernetes_pod_ip
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}:${2}

# ============================================================
# Grafana 配置
# ============================================================
grafana:
  enabled: true
  
  # 访问方式：ClusterIP，本地通过 kubectl port-forward 访问（端口 31080）
  service:
    type: ClusterIP
  
  # 默认账号密码
  adminUser: admin
  adminPassword: admin
  
  # 数据源和 Dashboard 自动配置
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
    dashboards:
      enabled: true
      defaultDatasourceEnabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      folderAnnotation: grafana_folder
  
  # Grafana 配置
  grafana.ini:
    server:
      root_url: http://localhost:31080
    auth.anonymous:
      enabled: true
      org_role: Viewer
    date_formats:
      default_timezone: Asia/Shanghai
  
  # 资源限制
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ============================================================
# Node Exporter - 监控节点指标（本地环境禁用）
# ============================================================
nodeExporter:
  enabled: false

# ============================================================
# Kube State Metrics - 监控 K8s 对象状态
# ============================================================
kubeStateMetrics:
  enabled: true

# ============================================================
# 告警管理器（可选）
# ============================================================
alertmanager:
  enabled: false  # 暂时禁用，需要时再启用

# ============================================================
# API Server（自签证书环境抓取可能报 TLS 错误，按集群实际情况开关）
# ============================================================
kubeAPIServer:
  enabled: false

# ============================================================
# 其他组件
# ============================================================
kubelet:
  enabled: true

# 控制面组件抓取（按集群环境适配）：
# docker-desktop 单机环境将控制面指标绑死在 127.0.0.1（上游安全加固），
# 节点 IP 不可达 → up 恒为 0 → 默认告警永久误报，故关闭。
# 迁移到控制面指标可达的生产集群时改回 true 即可（下方 defaultRules 同步恢复）。
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

# 对应的默认告警规则组必须一并关闭：
# KubeControllerManagerDown / KubeProxyDown / etcdMembersDown 等基于 absent()，
# 抓取目标删除后 up 序列消失 → absent 恒真 → 规则反而永久 firing。
defaultRules:
  rules:
    kubeControllerManager: false
    kubeScheduler: false
    kubeProxy: false
    etcd: false

# ============================================================
# 命名空间
# ============================================================
namespaceOverride: monitoring
