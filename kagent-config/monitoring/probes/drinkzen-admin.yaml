# Blackbox Probe - drinkzen Admin 前端
# 现状：admin 无真实 healthz（SPA 对任意路径返回 200 HTML），探测语义为"端口存活"
# TODO：业务侧上线真实 /healthz 后，module 改为 http_2xx_healthz
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: drinkzen-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: drinkzen
    app.kubernetes.io/component: frontend
spec:
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:19115
  interval: 30s
  module: http_2xx_root
  scrapeTimeout: 10s
  targets:
    staticConfig:
      static:
        - http://drinkzen-admin-local.drinkzen.svc.cluster.local:8080/
      labels:
        namespace: drinkzen
        service: drinkzen-admin