# Blackbox Probe - drinkzen Admin 前端（第一层：进程存活）
# 业务侧 nginx 已提供真实 /healthz（返回 application/json，非 SPA 兜底）
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: drinkzen-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: drinkzen
    app.kubernetes.io/component: frontend
spec:
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:19115
  interval: 30s
  module: http_2xx_healthz
  scrapeTimeout: 10s
  targets:
    staticConfig:
      static:
        - http://drinkzen-admin.drinkzen.svc.cluster.local:80/healthz
      labels:
        namespace: drinkzen
        service: drinkzen-admin
