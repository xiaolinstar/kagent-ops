# Blackbox Probe - drinkzen API 服务
# 由 Prometheus Operator 的 Probe CRD 管理，每 30 秒探测一次
# 指标标签：namespace=drinkzen, service=drinkzen-api
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: drinkzen-api
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: drinkzen
    app.kubernetes.io/component: backend
spec:
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:19115
  interval: 30s
  module: http_2xx_healthz
  scrapeTimeout: 10s
  targets:
    staticConfig:
      static:
        - http://drinkzen-api.drinkzen.svc.cluster.local:8000/healthz
      labels:
        namespace: drinkzen
        service: drinkzen-api
