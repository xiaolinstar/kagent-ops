# Blackbox Probe - party-helper API 服务
# Service 已统一为 ClusterIP 8021 -> targetPort 8021
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: party-helper-api
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: party-helper
    app.kubernetes.io/component: backend
spec:
  interval: 30s
  module: http_2xx_healthz
  scrapeTimeout: 10s
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:19115
  targets:
    staticConfig:
      static:
        - http://party-helper-api.party-helper.svc.cluster.local:8021/healthz
      labels:
        namespace: party-helper
        service: party-helper-api