# ModelConfig - DeepSeek
# kubectl apply -f kagent-config/crds/model-config.yaml

---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: default-model-config
  namespace: kagent
spec:
  provider: OpenAI
  model: "deepseek-flash"
  apiKeySecret: "kagent-deepseek"
  apiKeySecretKey: "DEEPSEEK_API_KEY"
  openAI:
    baseUrl: "https://api.deepseek.com/v1"