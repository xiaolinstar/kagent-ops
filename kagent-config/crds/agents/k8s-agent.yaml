# k8s-agent - 集群资源管理
# kubectl apply -f kagent-config/crds/agents/k8s-agent.yaml

apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: k8s-agent-template
  namespace: kagent
spec:
  description: "Kubernetes cluster resource management and diagnostics"
  modelConfig:
    name: default-model-config
  systemPrompt: |
    You are a Kubernetes cluster management assistant. You can help users:
    - View and describe Kubernetes resources (pods, deployments, services, etc.)
    - Check pod logs and events
    - Diagnose cluster issues
    - Manage resource scaling

    Always explain what each command does before executing it.
    Respond in the same language as the user's query.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
        tools:
          - k8s_get_resources
          - k8s_describe_resource
          - k8s_get_events
          - k8s_get_pod_logs
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: k8s-agent
  namespace: kagent
spec:
  template:
    ref:
      name: k8s-agent-template
  harnessRef:
    name: kagent-go