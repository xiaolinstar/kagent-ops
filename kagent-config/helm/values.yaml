# kagent Helm Values 配置
# 文档: https://www.kagent.dev/docs/kagent/resources/helm
#
# helm upgrade --install kagent-crds oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds \
#   -n kagent --create-namespace --version 1.0.0-alpha13
#
# helm upgrade --install kagent oci://ghcr.io/kagent-dev/kagent/helm/kagent \
#   -n kagent --version 1.0.0-alpha13 --values kagent-config/helm/values.yaml

fullnameOverride: kagent

# ============================================================
# LLM Provider - DeepSeek (通过 OpenAI 兼容接口)
# ============================================================
providers:
  default: openAI

  openAI:
    provider: OpenAI
    model: "deepseek-flash"
    apiKey: null  # 清除安装器历史占位值；凭证仅由独立 Secret 管理
    apiKeySecretRef: kagent-deepseek-runtime
    apiKeySecretKey: DEEPSEEK_API_KEY
    config:
      baseUrl: "https://api.deepseek.com/v1"

# ============================================================
# Application Configuration (alpha13 新增)
# ============================================================
config:
  server:
    auth:
      mode: insecure
  logging:
    level: info
  substrate:
    apiEndpoint: "dns:///api.ate-system.svc:443"
    routerUrl: "http://atenet-router.ate-system.svc:80"

# ============================================================
# Controller
# ============================================================
controller:
  substrateClientCertificate:
    enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 512Mi

# ============================================================
# UI
# ============================================================
ui:
  replicas: 1
  service:
    type: ClusterIP
    ports:
      port: 8080

# ============================================================
# Database (外部 PostgreSQL — 连接串 Secret)
# ============================================================
# 数据库由 alpha13 CLI 安装器初始化，保留其连接 Secret 与 PodCertificate。
database:
  postgres:
    clientCertificate:
      enabled: true
    connectionStringSecretRef:
      name: kagent-postgres
      key: connectionString

# ============================================================
# MCP & Tools
# ============================================================
kmcp:
  enabled: true

kagent-tools:
  enabled: true
  rbac:
    create: true
    readOnly: true
    allowSecrets: false
    namespaces: [kagent]
  tools:
    enabledTools: [k8s]
    args: ["--read-only"]
    loglevel: info

# Grafana MCP - 启用（连接本地 Grafana）
grafana-mcp:
  enabled: false  # 阶段 2 接通监控后再启用
  image:
    pullPolicy: IfNotPresent
  grafana:
    url: "http://monitoring-grafana.monitoring:80"

# ============================================================
# Agents (alpha13 变更)
# ============================================================
# alpha13 不再通过 chart values 控制内置 Agent 开关。
# Agent 需通过 CRD 单独创建，升级后执行：
#   kubectl --context kind-kagent apply -f kagent-config/crds/

substrateWorkerPool:
  create: true
  name: kagent-default
  replicas: 1
  sandboxClass: gvisor
  workerImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.5.0-alpha2@sha256:5869cdace628f93d39d913e41f91f2862db8bb7ca8ae2c6c756ee31015b3d719
