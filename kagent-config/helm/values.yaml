# kagent Helm Values 配置
# 文档: https://www.kagent.dev/docs/kagent/resources/helm
#
# helm upgrade --install kagent-crds oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds \
#   -n kagent --create-namespace --version 1.0.0-alpha13
#
# helm upgrade --install kagent oci://ghcr.io/kagent-dev/kagent/helm/kagent \
#   -n kagent --version 1.0.0-alpha13 --values kagent-config/helm/values.yaml

fullnameOverride: kagent

# ============================================================
# LLM Provider - DeepSeek (通过 OpenAI 兼容接口)
# ============================================================
providers:
  default: openAI

  openAI:
    provider: OpenAI
    model: "deepseek-flash"
    apiKeySecretRef: kagent-deepseek
    apiKeySecretKey: DEEPSEEK_API_KEY
    config:
      baseUrl: "https://api.deepseek.com/v1"

# ============================================================
# Application Configuration (alpha13 新增)
# ============================================================
config:
  server:
    auth:
      mode: insecure
  logging:
    level: info
  substrate:
    apiEndpoint: "dns:///localhost:443"
    routerUrl: "http://localhost:80"

# ============================================================
# Controller
# ============================================================
controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 512Mi

# ============================================================
# UI
# ============================================================
ui:
  replicas: 1
  service:
    type: ClusterIP
    ports:
      port: 8080

# ============================================================
# Database (外部 PostgreSQL — 连接串 Secret)
# ============================================================
# alpha13 移除了 bundled postgres，需提前创建 kagent-postgres Secret：
#   kubectl create secret generic kagent-postgres \
#     --from-literal=connectionString="postgres://kagent:kagent@kagent-postgresql.kagent.svc.cluster.local:5432/kagent?sslmode=disable" \
#     -n kagent
database:
  postgres:
    connectionStringSecretRef:
      name: kagent-postgres
      key: connectionString

# ============================================================
# MCP & Tools
# ============================================================
kmcp:
  enabled: true

kagent-tools:
  enabled: true

# Grafana MCP - 启用（连接本地 Grafana）
grafana-mcp:
  enabled: true
  grafana:
    url: "http://monitoring-grafana.monitoring:80"

# ============================================================
# Agents (alpha13 变更)
# ============================================================
# alpha13 不再通过 chart values 控制内置 Agent 开关。
# Agent 需通过 CRD 单独创建，升级后执行：
#   kubectl apply -f kagent-config/crds/agents.yaml
